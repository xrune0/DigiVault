spring.application.name=digivault

# ===== MySQL Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/digivault?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Read from the DB_PASSWORD environment variable (never commit the real password)
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== JWT =====
# Secret must be at least 32 characters long (256 bits) for HS256
# Read from the JWT_SECRET environment variable; the value after ":" is a fallback for local development only
jwt.secret=${JWT_SECRET:change-this-local-dev-secret-key-at-least-32-chars}
# 24 hours in milliseconds
jwt.expiration=86400000

# ===== File Upload =====
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
