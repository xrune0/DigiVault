spring.application.name=digivault

# ===== MySQL Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/digivault?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Read from the DB_PASSWORD environment variable (never commit the real password)
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== JWT =====
# Secret must be at least 32 characters long (256 bits) for HS256
# Read from the JWT_SECRET environment variable; the value after ":" is a fallback for local development only
jwt.secret=${JWT_SECRET:change-this-local-dev-secret-key-at-least-32-chars}
# 24 hours in milliseconds
jwt.expiration=86400000

# ===== File Upload =====
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== File Encryption (AES-256) =====
# Base64-encoded 32-byte key from the FILE_ENCRYPTION_KEY environment variable.
# If this key is lost, encrypted files can never be opened again.
file.encryption-key=${FILE_ENCRYPTION_KEY}

# ===== AI Summary (OpenAI) =====
# API key from the OPENAI_API_KEY environment variable (empty = AI summaries disabled)
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.url=https://api.openai.com/v1/chat/completions
