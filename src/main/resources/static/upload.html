<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiVault - Upload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%231d1b22'/><path d='M11 15v-3a5 5 0 0 1 10 0v3' fill='none' stroke='white' stroke-width='2.4'/><rect x='9' y='15' width='14' height='10' rx='2.5' fill='white'/></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar" data-page="upload"></aside>

        <main class="main">
            <header class="topbar" id="topbar"></header>

            <div class="upload-wrap">
                <div class="page-head">
                    <div>
                        <h1>Upload Document</h1>
                        <p>Files are encrypted before they're stored.</p>
                    </div>
                </div>

                <form id="uploadForm" class="card upload-card">
                    <div class="dropzone" id="dropzone">
                        <input type="file" id="fileInput" multiple aria-label="Choose files">
                        <div class="cloud"><svg class="i" viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.6-10A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9"/><path d="M12 12v8"/><path d="M9 15l3-3 3 3"/></svg></div>
                        <h3>Drag &amp; drop files here</h3>
                        <p>or click to browse</p>
                        <span class="btn btn-violet">Choose Files</span>
                        <p>Any file type • Max 10 MB per file</p>
                    </div>

                    <ul class="file-list" id="fileList"></ul>

                    <div class="form-field" style="margin-top:20px">
                        <label for="categoryInput">Category</label>
                        <select id="categoryInput" class="select full">
                            <option value="ID">ID</option>
                            <option value="Education">Education</option>
                            <option value="Medical">Medical</option>
                            <option value="Finance">Finance</option>
                            <option value="Work">Work</option>
                            <option value="Other" selected>Other</option>
                        </select>
                    </div>

                    <div class="ai-row">
                        <svg class="i" viewBox="0 0 24 24"><path d="M11 3l1.8 5.2L18 10l-5.2 1.8L11 17l-1.8-5.2L4 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
                        <div class="text">
                            <strong>Use the AI summary</strong>
                            <small>Get a quick summary of PDF, Word and text files after upload.</small>
                        </div>
                        <label class="switch" title="AI summary"><input type="checkbox" id="aiToggle"><span></span></label>
                    </div>

                    <button type="submit" class="btn btn-dark btn-block" id="uploadBtn">Upload &amp; Secure →</button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/upload.js"></script>
</body>
</html>
